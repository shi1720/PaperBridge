name: Verify PaperBridge
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:full
        env:
          E2E_PROJECT: chromium
      - run: npm audit --omit=dev && npm --prefix functions audit --omit=dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results

  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webkit-test-report
          retention-days: 3
          path: |
            playwright-report
            test-results
